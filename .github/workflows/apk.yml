name: APK de Gastos

# Compila la app Android cada vez que cambia y la publica como descarga en Releases.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar la llave de firma
        env:
          LLAVE_B64: ${{ secrets.GASTOS_LLAVE_B64 }}
          LLAVE_CLAVE_SECRETA: ${{ secrets.GASTOS_LLAVE_CLAVE }}
        run: |
          # Con los dos secretos cargados, todas las versiones salen firmadas igual y se instalan una encima de la otra.
          # Sin ellos se usa una llave descartable: la app funciona, pero para actualizarla hay que desinstalar la anterior.
          if [ -n "$LLAVE_B64" ] && [ -n "$LLAVE_CLAVE_SECRETA" ]; then
            echo "$LLAVE_B64" | base64 -d > "$RUNNER_TEMP/gastos.keystore"
            echo "LLAVE_CLAVE=$LLAVE_CLAVE_SECRETA" >> "$GITHUB_ENV"
            echo "Firma: llave fija"
          else
            CLAVE=$(openssl rand -hex 16)
            echo "::add-mask::$CLAVE"
            keytool -genkeypair -keystore "$RUNNER_TEMP/gastos.keystore" -alias gastos -keyalg RSA -keysize 2048 \
              -validity 20000 -storepass "$CLAVE" -keypass "$CLAVE" -dname "CN=Gastos"
            echo "LLAVE_CLAVE=$CLAVE" >> "$GITHUB_ENV"
            echo "::warning::Firma con llave descartable: faltan los secretos GASTOS_LLAVE_B64 y GASTOS_LLAVE_CLAVE"
          fi
          echo "LLAVE_ARCHIVO=$RUNNER_TEMP/gastos.keystore" >> "$GITHUB_ENV"
      - name: Compilar
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease -Pvc=${{ github.run_number }}
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk gastos.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Gastos para Android" \
            --notes "Descargá gastos.apk desde el teléfono e instalalo." --target "$GITHUB_SHA"
          gh release upload apk gastos.apk --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: gastos-apk
          path: gastos.apk
