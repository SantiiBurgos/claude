plugins {
    id 'com.android.application'
}

android {
    namespace 'ar.gastos.app'
    compileSdk 35

    defaultConfig {
        applicationId 'ar.gastos.app'
        minSdk 29
        targetSdk 34
        versionCode ((project.findProperty('vc') ?: '1') as int)
        versionName '1.0'
    }

    // La llave de firma no vive en el repositorio: la compilación la recibe por variables de entorno.
    signingConfigs {
        fija {
            storeFile file(System.getenv('LLAVE_ARCHIVO') ?: 'falta-llave.keystore')
            storePassword System.getenv('LLAVE_CLAVE')
            keyAlias 'gastos'
            keyPassword System.getenv('LLAVE_CLAVE')
        }
    }
    // Dos variantes de la misma app (mismo identificador y misma firma, así una se instala encima de la otra):
    //  - basica: sin lectura de notificaciones. Play Protect la deja instalar desde el navegador.
    //  - lector: suma la lectura de notificaciones de pago. Play Protect bloquea su instalación desde el navegador.
    flavorDimensions = ['tipo']
    productFlavors {
        basica { dimension 'tipo' }
        lector { dimension 'tipo' }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.fija
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.fija
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
